# easyJet: company-specific concepts, tried before the common map.
lines:
  disposal_proceeds:
    rules:
      - concepts: [ifrs-full:ProceedsFromSalesOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities]
        add_if_tagged: [ext:NetProceedsFromSaleAndLeasebacksClassifiedAsInvestingActivities,
                        ext:ProceedsFromSaleAndLeasebackOfAircraftClassifiedAsInvestingActivities]
        reason: >-
          Sale-and-leaseback proceeds are a company line, next to the sale of other PP&E (M8).
        checked: FY2024 filing (9 + 114)
      - concepts: [ext:NetProceedsFromSaleAndLeasebacksClassifiedAsInvestingActivities]
        reason: Before FY2024 only the sale-and-leaseback line is tagged.
        checked: FY2023 filing (76)
  contract_liabilities:
    rules:
      - concepts: [ext:CurrentUnearnedRevenue]
        reason: >-
          FY2022-FY2023 filings tag current unearned revenue (advance ticket sales) as a
          company concept.
        checked: FY2023 filing (1,498)
  current_investments:
    rules:
      - concepts: [ext:OtherInvestments]
        reason: >-
          Money market deposits, tagged as "other investments" from FY2024. easyJet counts
          them in its net cash ("cash, cash equivalents and other investments of £3.5 billion").
        checked: FY2025 filing (2,024)
      - concepts: [ext:MoneyMarketDeposits]
        reason: Same line as tagged in the FY2022-FY2023 filings.
        checked: FY2022 filing (126)
