# Wizz Air: company-specific concepts, tried before the common map.
lines:
  lease_payments:
    rules:
      - concepts: [ifrs-full:RepaymentsOfBorrowingsClassifiedAsFinancingActivities]
        years: [2021, 2022, 2023, 2024]
        reason: >-
          Until FY2025, Wizz Air tagged the repayment of lease liabilities as repayments of
          borrowings; its other debt repayments are separate company lines (secured and
          unsecured debt). The FY2026 filing tags the same FY2025 amount, 720.0, as payments of
          lease liabilities (M8).
        checked: FY2025 filing (720.0) against the FY2026 filing's FY2025 comparative (720.0)
  contract_liabilities:
    rules:
      - concepts: [ifrs-full:CurrentDeferredIncomeOtherThanCurrentContractLiabilities]
        reason: >-
          Wizz Air tags unearned ticket revenue as current deferred income (FY2023 on).
        checked: FY2025 filing (1,013.3)
      - concepts: [ifrs-full:DeferredIncomeClassifiedAsCurrent]
        reason: Same line as tagged in the FY2022 filing.
        checked: FY2022 filing (333.8)
  capex:
    rules:
      - concepts: [ext:PurchaseOfTangibleAndIntangibleAssetsClassifiedAsInvestingActivities]
        add_if_tagged: [ext:PurchaseOfAircraftMaintenanceAssetsClassifiedAsInvestingActivities]
        reason: >-
          Capex is tagged as purchases of tangible and intangible assets, plus capitalised
          aircraft maintenance, both company concepts.
        checked: FY2025 filing (258.8 + 23.9)
  interest_paid:
    rules:
      - concepts: [ext:InterestPaidLoansIFRSLeaseLiabilitiesClassifiedAsFinancingActivities]
        add_if_tagged: [ext:InterestPaidLoansJOLCOClassifiedAsFinancingActivities,
                        ext:InterestPaidLoansJOLCOAndFTLClassifiedAsFinancingActivities,
                        ext:InterestPaidUnsecuredDebtClassifiedAsFinancingActivities,
                        ext:InterestPaidSecuredDebtClassifiedAsFinancingActivities,
                        ext:InterestPaidOtherClassifiedAsFinancingActivities]
        reason: Interest paid is split by type of debt, with the set of lines varying by year.
        checked: FY2025 filing (156.5 + 50.6 + 5.0 + 9.5 + 1.9)
