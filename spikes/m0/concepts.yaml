# Core lines checked in the M0 coverage matrix.
#
# Each line lists the standard IFRS taxonomy concepts that count as "found".
# `keywords` drive the extension search: a company-specific concept counts as a
# candidate when its name contains every word of at least one keyword group.
# `period` is "duration" (flows: P&L, cash flow) or "instant" (balance sheet).
# A concept entry can be a list: the line is then found when all those parts are
# tagged (for example depreciation and amortisation reported separately).
# Keywords include French, Spanish and German words because some issuers name
# their own concepts in the language of the report.

lines:
  revenue:
    label: Revenue
    period: duration
    concepts:
      - ifrs-full:Revenue
      - ifrs-full:RevenueFromContractsWithCustomers
      - ifrs-full:RevenueAndOperatingIncome  # includes other operating income (Icelandair)
    keywords: [[revenue], [turnover], [chiffre, affaire], [importe, neto, cifra], [umsatz]]

  operating_profit:
    label: Operating profit
    period: duration
    concepts:
      - ifrs-full:ProfitLossFromOperatingActivities
    keywords: [[operating, result], [operating, profit], [operating, income], [ebit],
               [resultat, operationnel], [resultado, explotacion], [betriebsergebnis]]

  dda:
    label: Depreciation, amortisation and impairment
    period: duration
    concepts:
      - ifrs-full:DepreciationAmortisationAndImpairmentLossReversalOfImpairmentLossRecognisedInProfitOrLoss
      - ifrs-full:DepreciationAndAmortisationExpense
      - ifrs-full:AdjustmentsForDepreciationAmortisationAndImpairmentLossReversalOfImpairmentLossRecognisedInProfitOrLoss
      - ifrs-full:AdjustmentsForDepreciationAndAmortisationExpense
      - [ifrs-full:DepreciationExpense, ifrs-full:AmortisationExpense]
    keywords: [[depreciation], [amortisation], [amortization], [amortissement], [amortizacion],
               [abschreibung]]

  finance_costs:
    label: Finance costs / interest expense
    period: duration
    concepts:
      - ifrs-full:FinanceCosts
      - ifrs-full:InterestExpense
      - ifrs-full:InterestExpenseOnBorrowings
    keywords: [[finance, cost], [financial, expense], [interest, expense], [cost, debt]]

  fuel_cost:
    label: Fuel cost
    period: duration
    concepts: []  # no standard IFRS concept exists; extension or text only
    keywords: [[fuel]]

  profit:
    label: Profit for the year
    period: duration
    concepts:
      - ifrs-full:ProfitLoss
    keywords: []

  cash:
    label: Cash and cash equivalents
    period: instant
    concepts:
      - ifrs-full:CashAndCashEquivalents
      - ifrs-full:Cash  # cash without equivalents (Copenhagen Airports)
    keywords: [[cash, equivalent]]

  other_current_financial_assets:
    label: Other current financial assets (liquid investments)
    period: instant
    concepts:
      - ifrs-full:OtherCurrentFinancialAssets
      - ifrs-full:CurrentInvestments
      - ifrs-full:ShorttermDepositsNotClassifiedAsCashEquivalents
      - ifrs-full:CurrentFinancialAssetsAtFairValueThroughProfitOrLoss
      - ifrs-full:CurrentFinancialAssetsAtAmortisedCost
    keywords: [[current, financial, asset], [short, term, deposit], [money, market], [marketable, securit]]

  borrowings_current:
    label: Borrowings, current
    period: instant
    concepts:
      - ifrs-full:CurrentBorrowingsAndCurrentPortionOfNoncurrentBorrowings
      - ifrs-full:CurrentPortionOfNoncurrentBorrowings
      - ifrs-full:ShorttermBorrowings
      - ifrs-full:CurrentPortionOfLongtermBorrowings
    keywords: [[current, borrowing], [current, debt], [current, financial, debt], [short, term, debt],
               [emprunt, courant], [deuda, corriente], [finanzverbindlichkeit, kurzfristig]]

  borrowings_noncurrent:
    label: Borrowings, non-current
    period: instant
    concepts:
      - ifrs-full:NoncurrentPortionOfNoncurrentBorrowings
      - ifrs-full:LongtermBorrowings
    keywords: [[noncurrent, borrowing], [noncurrent, debt], [non, current, debt], [long, term, debt],
               [emprunt, non, courant], [deuda, no, corriente], [finanzverbindlichkeit, langfristig]]

  borrowings_total:
    label: Borrowings, total
    period: instant
    concepts:
      - ifrs-full:Borrowings
    keywords: [[borrowings], [financial, debt], [dette, financ], [deuda, financ]]

  lease_liabilities_current:
    label: Lease liabilities, current
    period: instant
    concepts:
      - ifrs-full:CurrentLeaseLiabilities
    keywords: [[current, lease], [location, courant], [arrendamiento, corriente]]

  lease_liabilities_noncurrent:
    label: Lease liabilities, non-current
    period: instant
    concepts:
      - ifrs-full:NoncurrentLeaseLiabilities
    keywords: [[noncurrent, lease], [non, current, lease], [location, non, courant],
               [arrendamiento, no, corriente]]

  lease_liabilities_total:
    label: Lease liabilities, total
    period: instant
    concepts:
      - ifrs-full:LeaseLiabilities
    keywords: [[lease, liabilit], [lease, debt], [dette, location], [pasivo, arrendamiento],
               [leasingverbindlichkeit]]

  debt_including_leases:
    label: Borrowings and lease liabilities on one line
    period: instant
    concepts: []  # no standard IFRS concept; some issuers tag a combined extension
    keywords: [[borrowing, lease], [finanz, leasingverbindlichkeit]]

  contract_liabilities:
    label: Contract liabilities (advance ticket sales)
    period: instant
    concepts:
      - ifrs-full:ContractLiabilities
      - ifrs-full:CurrentContractLiabilities
    keywords: [[advance, ticket], [unearned, transport], [unearned, revenue], [contract, liabilit], [deferred, revenue]]

  equity:
    label: Total equity
    period: instant
    concepts:
      - ifrs-full:Equity
    keywords: []

  total_assets:
    label: Total assets
    period: instant
    concepts:
      - ifrs-full:Assets
    keywords: []

  cfo:
    label: Cash from operations
    period: duration
    concepts:
      - ifrs-full:CashFlowsFromUsedInOperatingActivities
      - [ifrs-full:CashFlowsFromUsedInOperatingActivitiesContinuingOperations,
         ifrs-full:CashFlowsFromUsedInOperatingActivitiesDiscontinuedOperations]
    keywords: [[cash, operating, activit], [flux, activit, operationnel], [flux, exploitation],
               [flujo, explotacion], [cashflow, betrieb]]

  capex_ppe:
    label: Purchases of PP&E
    period: duration
    concepts:
      - ifrs-full:PurchaseOfPropertyPlantAndEquipmentClassifiedAsInvestingActivities
      - ifrs-full:PurchaseOfPropertyPlantAndEquipmentIntangibleAssetsOtherThanGoodwillInvestmentPropertyAndOtherNoncurrentAssets
    keywords: [[purchase, property], [acquisition, property], [capital, expenditure], [capex],
               [purchase, aircraft], [purchase, tangible], [invest, corporel], [adquisicion, inmovilizado],
               [inversion, inmovilizado], [auszahlung, sachanlage], [investition, sachanlage]]

  capex_intangibles:
    label: Purchases of intangibles
    period: duration
    concepts:
      - ifrs-full:PurchaseOfIntangibleAssetsClassifiedAsInvestingActivities
    keywords: [[purchase, intangible], [acquisition, intangible], [invest, incorporel],
               [auszahlung, immateriell]]

  interest_paid:
    label: Interest paid
    period: duration
    concepts:
      - ifrs-full:InterestPaidClassifiedAsOperatingActivities
      - ifrs-full:InterestPaidClassifiedAsFinancingActivities
    keywords: [[interest, paid], [interet, paye], [interes, pagado], [zinsen, gezahlt]]

  tax_paid:
    label: Income tax paid
    period: duration
    concepts:
      - ifrs-full:IncomeTaxesPaidRefundClassifiedAsOperatingActivities
      - ifrs-full:IncomeTaxesPaidRefund
    keywords: [[tax, paid], [impot, paye], [impuesto, pagado], [steuer, gezahlt]]

# Notes are tagged as whole text blocks (mandatory from FY2022).
text_blocks:
  note_borrowings:
    label: Note — borrowings
    concepts:
      - ifrs-full:DisclosureOfBorrowingsExplanatory
  note_leases:
    label: Note — leases
    concepts:
      - ifrs-full:DisclosureOfLeasesExplanatory
  note_segments:
    label: Note — segments
    concepts:
      - ifrs-full:DisclosureOfEntitysReportableSegmentsExplanatory
      - ifrs-full:DisclosureOfOperatingSegmentsExplanatory
  note_financial_risk:
    label: Note — financial risk / hedging
    concepts:
      - ifrs-full:DisclosureOfFinancialRiskManagementExplanatory
      - ifrs-full:DisclosureOfNatureAndExtentOfRisksArisingFromFinancialInstrumentsExplanatory
      - ifrs-full:DisclosureOfHedgeAccountingExplanatory

# An issuer-year is usable when every requirement below is met. Each requirement
# lists alternatives; one alternative is met when all its lines are found or extension.
critical:
  revenue: [[revenue]]
  operating_profit: [[operating_profit]]
  dda: [[dda]]
  cash: [[cash]]
  # Total debt = borrowings + lease liabilities. `leases_in_borrowings` is set from
  # config/issuers.yaml when the debt note shows leases inside the borrowings line.
  borrowings: [[borrowings_current, borrowings_noncurrent], [borrowings_total],
               [debt_including_leases]]
  lease_liabilities: [[lease_liabilities_current, lease_liabilities_noncurrent],
                      [lease_liabilities_total], [debt_including_leases],
                      [leases_in_borrowings]]
  cfo: [[cfo]]
  capex: [[capex_ppe]]

# Words searched in the airline annual report text (traffic and liquidity items).
# French terms cover Air France-KLM, whose filing is in French.
report_text_terms:
  ask: ["available seat kilometres", "available seat kilometers", "ASK",
        "sièges-kilomètres offerts", "SKO"]
  rpk: ["revenue passenger kilometres", "revenue passenger kilometers", "RPK",
        "passagers-kilomètres transportés", "PKT"]
  passengers: ["passengers carried", "passengers", "passagers transportés"]
  load_factor: ["load factor", "coefficient d'occupation", "coefficient de remplissage"]
  fleet: ["fleet", "flotte"]
  undrawn: ["undrawn", "unused credit", "revolving credit facility", "RCF", "non tirée",
            "crédit renouvelable"]
  fuel_hedge: ["hedged", "hedging", "couverture carburant", "couverture du carburant"]

first_fiscal_year: 2021
min_years_for_go: 3
