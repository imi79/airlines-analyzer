# M4 commentary score (decision 0018): the ten drafts of the score sheet, scored by Claude at
# Imane's request ("check it yourself with the annual reports of the companies"), after
# checking each draft against the company's annual report. Not an independent review: the
# scorer is the same kind of model that wrote the drafts. Imane can change any score; the
# score sheet (docs/m4/score_sheet.xlsx) is written from this file.
#
# Scale: 5 publishable as is; 4 minor edits; 3 usable after editing; 2 significant errors or
# omissions; 1 misleading on a credit point.
# `draft`: the draft's fact sheet fingerprint (first 12 characters), so a score always refers
# to one exact text.
#
# Round 2 (2026-11-09): drafts after fixes A to D (prompt draft-v5, events, corrected
# figures). Round 1 scores (average 2.93) are kept in decision 0018.

scored_by: Claude, at Imane's request (2026-11-09, round 2)
