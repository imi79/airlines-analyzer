[project]
name = "airline-credit-tearsheet"
version = "0.0.1"
description = "Two-page credit tearsheets for European airlines and airports from ESEF/UKSEF filings"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "xlsxwriter>=3.2",
]

[project.scripts]
tearsheet = "tearsheet.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.build-backend]
module-name = "tearsheet"
