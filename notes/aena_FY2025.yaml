analyst_view: 'A strong, regulated infrastructure credit. The EBITDA margin of 60.3%
  is the highest of the airport group, net leverage is 1.46x and interest coverage
  14.72x. Moody''s upgraded the rating and Fitch affirmed it with a stable outlook;
  the regulator set next year''s average charge per passenger above this year''s.

  The investment cycle is the point to watch: capex intensity rose 2.6 points to 16.9%
  and free cash flow fell 10.2% to EUR 1.7bn, though FCF to debt of 22.9% is still
  the best in the group. Liquidity of EUR 4.3bn (68.4% of revenue, including EUR 2.2bn
  undrawn) covers the programme comfortably.'
