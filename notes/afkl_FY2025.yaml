analyst_view: 'Improving credit from a still-leveraged base. Higher EBITDA (EUR 5.1bn,
  margin up 2.2 points to 15.3%) took net leverage down to 1.71x and interest coverage
  up to 8.06x, even as net debt rose to EUR 8.7bn.

  Free cash flow turned positive at EUR 606m but stays thin against the fleet programme:
  FCF to debt of 3.9% is the weakest of the network peers. Cash covers 20.8% of revenue,
  also the lowest of the group, and advance ticket sales equal 62.2% of it.

  The 2025 refinancing (EMTN bonds, hybrid redemption, credit facility extended) supports
  the maturity profile. Further deleveraging needs EBITDA to hold above EUR 5bn while
  capex stays high.'
