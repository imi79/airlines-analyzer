# Commentary drafting (M4): what the AI drafts, and what it may talk about.
#
# The AI never writes a number. It writes sentences with labelled blanks such as
# {{net_leverage@FY2025}}, and code fills each blank from the fact sheet (decision 0016).

# The six drafted sections, in tearsheet order. The analyst view is never drafted.
# sentences: [minimum, maximum]. `uses` lists the figures the section is about (a guide for the
# AI; the verifier accepts any figure from the fact sheet in any section).
sections:
  snapshot:
    title: Snapshot
    sentences: [3, 3]
    purpose: >-
      Three sentences: who the company is and the year's credit story in one line, the main
      credit metric movement, and the main point to watch.
    uses: [ebitda_margin, net_leverage, revenue, liquidity_to_revenue, cash_liquidity_to_revenue]
  credit_metrics:
    title: Credit metrics
    sentences: [2, 5]
    purpose: Earnings, leverage, coverage and cash flow against debt, with the year-on-year move.
    uses:
      - revenue
      - operating_profit
      - ebitda
      - dda
      - finance_costs
      - cfo
      - capex
      - ebitda_margin
      - total_debt
      - net_debt
      - net_cash
      - net_leverage
      - gross_leverage
      - interest_coverage
      - ffo
      - ffo_to_debt
      - fcf
      - fcf_to_debt
      - capex_intensity
  operating_performance:
    title: Operating performance
    sentences: [2, 5]
    purpose: >-
      Traffic, capacity, unit revenue and unit cost, fuel and fleet for airlines; passengers,
      revenue per passenger and the aeronautical mix for airports.
    uses:
      - passengers
      - ask
      - rpk
      - load_factor
      - passenger_yield
      - rask
      - cask
      - cask_ex_fuel
      - fuel_share_of_costs
      - fuel_cost
      - fleet
      - fleet_age
      - fuel_hedge_ratio
      - traffic_growth
      - revenue_per_passenger
      - aero_revenue_per_passenger
      - non_aero_share
  liquidity_funding:
    title: Liquidity and funding
    sentences: [2, 4]
    purpose: Cash, undrawn committed facilities, liquidity against revenue, customer prepayments.
    uses:
      - cash_like
      - undrawn_facilities
      - liquidity
      - liquidity_to_revenue
      - cash_liquidity
      - cash_liquidity_to_revenue
      - advance_ticket_cover
      - contract_liabilities
  peer_positioning:
    title: Peer positioning
    sentences: [2, 3]
    purpose: Where the company sits against its peer group's median and rank.
    uses: [peer_median, peer_rank]
  watch_items:
    title: Watch items
    sentences: [2, 4]
    purpose: >-
      Points a credit analyst should monitor, each tied to a figure: a weakening metric, a
      figure below peers, a funding or liquidity point.
    uses: []

# Statement lines offered to the AI besides the catalog metrics, with their direction flag
# (true: higher is better; null: neither).
statement_lines:
  revenue: true
  operating_profit: true
  profit: true
  contract_liabilities: null
  undrawn_facilities: true
  # Round 5 (decision 0018): the lines that explain moves, so a cause such as "as depreciation
  # rose" rests on a checked figure instead of being removed by the verifier.
  dda: null
  finance_costs: false
  fuel_cost: null
  cfo: true
  capex: null

# Peer group used for medians and ranks: the company's own group (not "all airlines").
peer_groups: [network, low_cost, airports]

# Names and labels that contain digits and are allowed in the prose (verifier rule 1).
# Regular expressions, matched as whole words. Fiscal-year labels (FY2025) and years
# (2015 to 2035) are always allowed.
allowed_names:
  - 'IFRS ?\d{1,2}'
  - 'IAS ?\d{1,2}'
  - 'COVID-19'
  - 'CO2'
  - 'A3[1-5]\d(?:neo|ceo|XLR|LR|-\d{3,4})?'
  - 'A220(?:-[13]00)?'
  - 'A380'
  - 'Boeing 7[3-8]7(?: MAX(?: \d{1,2})?)?(?:-\d{1,3})?'  # 737-800 (decision 0018, round 4)
  - '7[3-8]7(?: MAX(?: \d{1,2})?)?(?:-\d{1,3})?'
  - 'E1[79]5|E190(?:-E2)?|E195(?:-E2)?'
  - 'ATR ?[47]2(?:-600)?'
  - 'Q400'
  - 'Terminal ?\d'
  - 'T\d'

# Net cash (decision 0018, fix B): where net debt is below zero, the fact sheet offers "net
# cash" as a positive figure, so the note reads "net cash of GBP 602m", never "net debt of
# GBP -602m".
net_cash:
  from: net_debt
  label: Net cash (cash and cash-like investments above total debt)

# Ratios to debt mean little when there is almost no debt (Flughafen Wien: FFO to debt 442%,
# coverage 209x). Below this gross leverage they are left out of the fact sheet, and the
# company is left out of the peer median and rank for them.
small_debt:
  gross_leverage_below: 0.5
  metrics: [ffo_to_debt, fcf_to_debt, interest_coverage]

# The same figure under two names (decision 0018, round 4): where cash liquidity equals cash
# and cash-like investments (no undrawn lines are added), only the second is offered, so the
# note never says "cash fell to X, so cash liquidity fell to X".
same_figure:
  cash_liquidity: cash_like
