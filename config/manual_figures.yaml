# Figures entered by hand from published statements (decision 0007).
#
# Used only where no electronic (ESEF) filing is available: Air France-KLM and ADP FY2025.
# Amounts are in millions of the reporting currency, as printed. Costs and cash outflows are
# entered as positive amounts, like every other figure in the database.
# Each line: [entered year, prior year shown in the same document, printed page, label].
# A value written as a list is the sum of the items listed (for example two lines of a note).
# The prior-year column is a control: it is compared with the figure the database already holds
# for that year, which catches a typing error and shows any restatement. For lines listed under
# `prior_year_as_fact` there is no tagged figure to compare with, so the prior-year column is
# loaded as that year's figure instead (M2: items of the company's own net debt definition).
# `reviewed_by` stays empty until Imane has reviewed the entries. Until then the figures are
# stored as "unverified" and stay off the tearsheet (spec: AI layer and figure verification).
# Lines added to a document after its review are listed under `pending_review` and stay
# unverified until reviewed in turn.

