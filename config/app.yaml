# What the web app shows (M5). Only metric ids: every figure comes from the facts database.
#
# kpi_cards     the headline cards at the top of the tearsheet, with the move on last year
# kpi_table     rows of the four-year table, by company type (all, then airline or airport)
# charts        the two tearsheet charts
# years_shown   how many fiscal years the table and charts show (spec: the last three by
#               default; four on the tearsheet's KPI table)

years_shown: 4

kpi_cards:
  all: [ebitda_margin, net_leverage, interest_coverage, liquidity_to_revenue]
  airline: [passengers]
  airport: [passengers]
  # when a card's figure is missing or awaiting review, show this one instead
  fallback:
    liquidity_to_revenue: cash_liquidity_to_revenue

kpi_table:
  all:
    - revenue
    - ebitda
    - ebitda_margin
    - total_debt
    - net_debt
    - net_leverage
    - gross_leverage
    - interest_coverage
    - ffo_to_debt
    - fcf
    - fcf_to_debt
    - fcf_after_leases
    - capex_intensity
    - liquidity
    - liquidity_to_revenue
    - short_term_debt_cover
  airline:
    - passengers
    - ask
    - load_factor
    - rask
    - cask
    - fuel_share_of_costs
    - advance_ticket_cover
  airport:
    - passengers
    - traffic_growth
    - revenue_per_passenger
    - non_aero_share

charts:
  leverage:
    title: Leverage
    metrics: [net_leverage, gross_leverage]
  liquidity:
    # M8 (plan question 5): the year's liquidity beside the debt falling due, from the checked
    # maturity table (borrowings, then leases where shown apart); without a checked table, the
    # debt due within one year from the balance sheet. Liquidity over four years stays in the
    # KPI table.
    title: Liquidity against maturities
    kind: maturities
    # the liquidity bar, stacked: cash first, then the undrawn credit lines
    metrics: [cash_like, undrawn_facilities]
    layers: [borrowings, leases]
    fallback: debt_due_1y

# The analyst's name recorded with approvals and edits in live mode.
analyst: Imane

# Short names for narrow table headings (PDF peer table).
short_names:
  afkl: AF-KLM
  iag: IAG
  finnair: Finnair
  easyjet: easyJet
  norwegian: Norwegian
  wizz: Wizz Air
  adp: ADP
  aena: Aena
  vie: Vienna

# The PDF tearsheet (M6, decision 0020): body text sizes tried in turn until it fits two
# pages, and the analyst view's fixed box.
pdf:
  font_sizes: [8.5, 8.0, 7.5]
  analyst_view_max_lines: 8
  analyst_view_chars_per_line: 110  # at the first size; more fit at smaller sizes
